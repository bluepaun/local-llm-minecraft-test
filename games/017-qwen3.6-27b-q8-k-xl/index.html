<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:monospace}
canvas{display:block}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;pointer-events:none;z-index:10;text-shadow:0 0 2px #000}
#hotbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:10}
.slot{width:48px;height:48px;border:2px solid #555;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:2px;color:#fff;font-size:8px;text-align:center;text-shadow:1px 1px 1px #000}
.slot.active{border-color:#fff}
#info{position:fixed;top:10px;left:10px;color:#fff;font-size:13px;z-index:10;text-shadow:0 0 2px #000;line-height:1.6;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="crosshair">+</div>
<div id="hotbar"></div>
<div id="info"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const CHUNK_SIZE = 16;
const CHUNK_HEIGHT = 64;
const RENDER_DIST = 3;
const GRAVITY = -25;
const JUMP_VEL = 9;
const MOVE_SPEED = 5.5;
const SPRINT_MULT = 1.4;

const BLOCK = {air:0,grass:1,dirt:2,stone:3,sand:4,water:5,wood:6,leaves:7,bedrock:8,plank:9,cobble:10};

const BLOCK_COLORS = {
  grass:'#5a9e3f', dirt:'#8b6b3d', stone:'#888888', sand:'#d4c878',
  water:'#3366aa', wood:'#6b4e2a', leaves:'#2d7a1e', bedrock:'#333333', plank:'#bc9456', cobble:'#666666'
};

const PLACEABLE = ['grass','dirt','stone','sand','wood','leaves','plank','cobble'];

class SimplexNoise {
  constructor(seed) {
    this.p = new Uint8Array(512);
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    let s = seed;
    for (let i = 255; i > 0; i--) {
      s = (s * 16807) % 2147483647;
      const j = s % (i + 1);
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  noise2D(x, y) {
    const F2 = 0.5*(Math.sqrt(3)-1), G2 = (3-Math.sqrt(3))/6;
    const s = (x+y)*F2, i = Math.floor(x+s), j = Math.floor(y+s);
    const t = (i+j)*G2, x0 = x-(i-t), y0 = y-(j-t);
    const i1 = x0>y0?1:0, j1 = x0>y0?0:1;
    const x1 = x0-i1+G2, y1 = y0-j1+G2, x2 = x0-1+2*G2, y2 = y0-1+2*G2;
    const ii=i&255, jj=j&255;
    const grad = (h,gx,gy) => {const u=h<4?gx:gy,v=h<4?gy:gx;return((h&1)?-u:u)+((h&2)?-v:v);};
    let n0=0,n1=0,n2=0;
    let t0=0.5-x0*x0-y0*y0; if(t0>0){t0*=t0;n0=t0*t0*grad(this.p[ii+this.p[jj]],x0,y0);}
    let t1=0.5-x1*x1-y1*y1; if(t1>0){t1*=t1;n1=t1*t1*grad(this.p[ii+i1+this.p[jj+j1]],x1,y1);}
    let t2=0.5-x2*x2-y2*y2; if(t2>0){t2*=t2;n2=t2*t2*grad(this.p[ii+1+this.p[jj+1]],x2,y2);}
    return 70*(n0+n1+n2);
  }
  octave(x, y, octaves, persistence) {
    let total=0,freq=1,amp=1,maxV=0;
    for(let i=0;i<octaves;i++){total+=this.noise2D(x*freq,y*freq)*amp;maxV+=amp;amp*=persistence;freq*=2;}
    return total/maxV;
  }
}

const noise = new SimplexNoise(42);
const treeNoise = new SimplexNoise(123);
const chunks = new Map();
const chunkMeshes = new Map();

function chunkKey(cx,cz){return cx+','+cz;}

function getHeight(wx,wz){
  return Math.floor(18 + noise.octave(wx*0.015, wz*0.015, 4, 0.5)*20);
}

function generateChunkData(cx,cz){
  const key = chunkKey(cx,cz);
  if(chunks.has(key)) return;
  const data = new Uint8Array(CHUNK_SIZE*CHUNK_HEIGHT*CHUNK_SIZE);
  function idx(x,y,z){return x+CHUNK_SIZE*(y+CHUNK_HEIGHT*z);}
  for(let x=0;x<CHUNK_SIZE;x++){
    for(let z=0;z<CHUNK_SIZE;z++){
      const wx=cx*CHUNK_SIZE+x, wz=cz*CHUNK_SIZE+z;
      const h=getHeight(wx,wz);
      for(let y=0;y<CHUNK_HEIGHT;y++){
        if(y===0) data[idx(x,y,z)]=BLOCK.bedrock;
        else if(y<h-4) data[idx(x,y,z)]=BLOCK.stone;
        else if(y<h) data[idx(x,y,z)]=BLOCK.dirt;
        else if(y===h) data[idx(x,y,z)] = h<12?BLOCK.sand:BLOCK.grass;
        else if(y<=10&&y>h) data[idx(x,y,z)]=BLOCK.water;
      }
    }
  }
  // Trees
  for(let x=2;x<CHUNK_SIZE-2;x++){
    for(let z=2;z<CHUNK_SIZE-2;z++){
      const wx=cx*CHUNK_SIZE+x, wz=cz*CHUNK_SIZE+z;
      const h=getHeight(wx,wz);
      if(h>=13&&h<35&&treeNoise.noise2D(wx*0.5,wz*0.5)>0.6){
        const trunkH=4+Math.floor(Math.random()*2);
        for(let ty=1;ty<=trunkH;ty++){if(h+ty<CHUNK_HEIGHT)data[idx(x,h+ty,z)]=BLOCK.wood;}
        for(let ly=-2;ly<=0;ly++){
          const r=ly===0?1:2;
          for(let lx=-r;lx<=r;lx++){
            for(let lz=-r;lz<=r;lz++){
              if(lx===0&&lz===0&&ly<0)continue;
              if(Math.abs(lx)+Math.abs(lz)>r+1)continue;
              const nx=x+lx,nz=z+lz,ny=h+trunkH+ly;
              if(nx>=0&&nx<CHUNK_SIZE&&nz>=0&&nz<CHUNK_SIZE&&ny>=0&&ny<CHUNK_HEIGHT){
                if(!data[idx(nx,ny,nz)])data[idx(nx,ny,nz)]=BLOCK.leaves;
              }
            }
          }
        }
      }
    }
  }
  chunks.set(key,data);
}

function getBlock(wx,wy,wz){
  if(wy<0||wy>=CHUNK_HEIGHT)return BLOCK.air;
  const cx=Math.floor(wx/CHUNK_SIZE),cz=Math.floor(wz/CHUNK_SIZE);
  const data=chunks.get(chunkKey(cx,cz));
  if(!data)return BLOCK.air;
  const lx=((wx%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE,lz=((wz%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE;
  return data[lx+CHUNK_SIZE*(wy+CHUNK_HEIGHT*lz)];
}

// --- Three.js ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, CHUNK_SIZE*RENDER_DIST*1.2, CHUNK_SIZE*RENDER_DIST*1.6);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfff5e6, 0.8);
sun.position.set(0.5,1,0.3).normalize();
scene.add(sun);

// --- Procedural Textures ---
function makeTex(drawFn){
  const c=document.createElement('canvas');c.width=64;c.height=64;
  drawFn(c.getContext('2d'),64);
  const tex=new THREE.CanvasTexture(c);
  tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.NearestFilter;return tex;
}

function noiseTex(base,seed){
  return makeTex((ctx,s)=>{
    ctx.fillStyle=base;ctx.fillRect(0,0,s,s);
    let r=seed;for(let i=0;i<256;i++){r=(r*16807)%2147483647;ctx.fillStyle='rgba('+(r%120)+','+(r%100)+','+(r%80)+','+((r%40)/100)+')';ctx.fillRect(r%s,r%s,2+Math.floor(r%3),2+Math.floor(r%3));}
  });
}

const T={};
T[BLOCK.grass]=makeTex((ctx,s)=>{for(let i=0;i<s;i++)for(let j=0;j<s;j++){const v=Math.random();ctx.fillStyle=v>0.5?'#4a8a2f':'#6aaa3f';ctx.fillRect(i,j,1,1);}});
T[BLOCK.dirt]=makeTex((ctx,s)=>{ctx.fillStyle='#8b6b3d';ctx.fillRect(0,0,s,s);for(let i=0;i<200;i++){ctx.fillStyle='rgba(0,0,0,'+Math.random()*0.15+')';ctx.fillRect(Math.random()*s,Math.random()*s,2,2);}});
T[BLOCK.stone]=makeTex((ctx,s)=>{ctx.fillStyle='#888';ctx.fillRect(0,0,s,s);for(let i=0;i<30;i++){const v=100+Math.floor(Math.random()*60);ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.fillRect(Math.random()*(s-8),Math.random()*(s-8),4+Math.random()*8,4+Math.random()*8);}});
T[BLOCK.sand]=makeTex((ctx,s)=>{ctx.fillStyle='#d4c878';ctx.fillRect(0,0,s,s);for(let i=0;i<150;i++){ctx.fillStyle='rgba(200,190,130,'+Math.random()*0.4+')';ctx.fillRect(Math.random()*s,Math.random()*s,2,2);}});
T[BLOCK.water]=makeTex((ctx,s)=>{ctx.fillStyle='#3366aa';ctx.fillRect(0,0,s,s);for(let i=0;i<80;i++){ctx.fillStyle='rgba(50,120,200,'+Math.random()*0.3+')';ctx.fillRect(Math.random()*s,Math.random()*s,3,2);}});
T[BLOCK.wood]=makeTex((ctx,s)=>{for(let y=0;y<s;y++){ctx.fillStyle=y%4<2?'#6b4e2a':'#8B6914';ctx.fillRect(0,y,s,1);}for(let i=0;i<50;i++){ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(Math.random()*s,Math.random()*s,3,2);}});
T[BLOCK.leaves]=makeTex((ctx,s)=>{for(let i=0;i<s;i++)for(let j=0;j<s;j++){const v=Math.random();ctx.fillStyle=v>0.3?'#2d7a1e':'#1d5a0e';ctx.fillRect(i,j,1,1);}});
T[BLOCK.bedrock]=makeTex((ctx,s)=>{ctx.fillStyle='#333';ctx.fillRect(0,0,s,s);for(let i=0;i<100;i++){const v=Math.floor(Math.random()*40);ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.fillRect(Math.random()*s,Math.random()*s,3,3);}});
T[BLOCK.plank]=makeTex((ctx,s)=>{ctx.fillStyle='#bc9456';ctx.fillRect(0,0,s,s);for(let y=0;y<4;y++){ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.moveTo(0,y*16);ctx.lineTo(s,y*16);ctx.stroke();}for(let i=0;i<50;i++){ctx.fillStyle='rgba(0,0,0,'+Math.random()*0.06+')';ctx.fillRect(Math.random()*s,Math.random()*s,3,2);}});
T[BLOCK.cobble]=makeTex((ctx,s)=>{ctx.fillStyle='#666';ctx.fillRect(0,0,s,s);for(let i=0;i<15;i++){const v=80+Math.floor(Math.random()*60);ctx.strokeStyle='rgba(40,40,40,0.4)';ctx.strokeRect(Math.random()*(s-12),Math.random()*(s-12),5+Math.random()*10,5+Math.random()*10);ctx.fillStyle=`rgb(${v},${v},${v})`;ctx.fillRect(1+Math.random()*(s-14),1+Math.random()*(s-14),6+Math.random()*8,6+Math.random()*8);}});

// Grass side texture: top green line, rest dirt
T['_grass_side']=makeTex((ctx,s)=>{ctx.fillStyle='#8b6b3d';ctx.fillRect(0,0,s,s);for(let i=0;i<150;i++){ctx.fillStyle='rgba(0,0,0,'+Math.random()*0.1+')';ctx.fillRect(Math.random()*s,Math.random()*s,2,2);}ctx.fillStyle='#5a9e3f';ctx.fillRect(0,0,s,6);for(let x=0;x<s;x++){const v=Math.random();if(v>0.4){ctx.fillStyle=v>0.7?'#4a8a2f':'#6aaa3f';ctx.fillRect(x,1,1,2+Math.floor(Math.random()*3));}}});

function makeMats(id){
  if(id===BLOCK.grass){
    const side=T['_grass_side'],top=T[BLOCK.grass],bot=T[BLOCK.dirt];
    return[side,side,top,bot,side,side];
  }
  return new THREE.MeshLambertMaterial({
    map:T[id],
    transparent:id===BLOCK.water||id===BLOCK.leaves,
    opacity:id===BLOCK.water?0.65:1
  });
}

const cubeGeo = new THREE.BoxGeometry(1,1,1);

function isOpaque(b){return b!==BLOCK.air&&b!==BLOCK.water;}

function buildChunkMesh(cx,cz){
  const key=chunkKey(cx,cz),data=chunks.get(key);
  if(!data)return null;
  const old=chunkMeshes.get(key);
  if(old){scene.remove(old);if(old.geometry)old.geometry.dispose();if(Array.isArray(old.material))old.material.forEach(m=>m&&m.dispose());else if(old.material)old.material.dispose();chunkMeshes.delete(key);}

  // Collect by block type for instancing
  const positions = {};
  function idx(x,y,z){return x+CHUNK_SIZE*(y+CHUNK_HEIGHT*z);}
  
  for(let x=0;x<CHUNK_SIZE;x++){
    for(let y=0;y<CHUNK_HEIGHT;y++){
      for(let z=0;z<CHUNK_SIZE;z++){
        const b=data[idx(x,y,z)];
        if(b===BLOCK.air)continue;
        const wx=cx*CHUNK_SIZE+x,wz=cz*CHUNK_SIZE+z;
        // Check if any face is exposed
        const exp=!isOpaque(getBlock(wx-1,y,wz))||!isOpaque(getBlock(wx+1,y,wz))||
          (b!==BLOCK.water&&!isOpaque(getBlock(wx,y-1,wz)))||!isOpaque(getBlock(wx,y+1,wz))||
          !isOpaque(getBlock(wx,y,wz-1))||!isOpaque(getBlock(wx,y,wz+1));
        if(!exp)continue;
        
        const k=b+'_'+x+'_'+y+'_'+z;
        const px=wx+0.5, py=b===BLOCK.water?y+0.6:y+0.5, pz=wz+0.5;
        if(!positions[b])positions[b]=[];
        positions[b].push({x:px,y:py,z:pz,b});
      }
    }
  }

  // Use instanced mesh for performance
  const group = new THREE.Group();
  for(const bid in positions){
    const arr=positions[bid];
    if(!arr.length)continue;
    const id=parseInt(bid);
    const mats=makeMats(id);
    
    // Instancing doesn't work with multi-face materials + water scaling, so use regular meshes grouped by type
    // For simplicity with different block types, just create individual meshes in a group
    for(const p of arr){
      const m=new THREE.Mesh(cubeGeo,mats);
      m.position.set(p.x,p.y,p.z);
      if(id===BLOCK.water)m.scale.y=0.7;
      group.add(m);
    }
  }
  
  scene.add(group);
  chunkMeshes.set(key,group);
}

// --- Player ---
const player={pos:new THREE.Vector3(0.5,40,0.5),vel:new THREE.Vector3(),yaw:0,pitch:0,onGround:false,h:1.62,w:0.3,slot:0};
camera.position.copy(player.pos);camera.position.y+=player.h;

const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true;const n=parseInt(e.key);if(n>=1&&n<=PLACEABLE.length){player.slot=n-1;updateHotbar();}});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

document.addEventListener('click',()=>{if(!document.pointerLockElement)renderer.domElement.requestPointerLock();});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement)return;
  player.yaw-=e.movementX*0.002;player.pitch-=e.movementY*0.002;
  player.pitch=Math.max(-Math.PI/2+0.01,Math.min(Math.PI/2-0.01,player.pitch));
});

function getTarget(){
  const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));
  let prevPt=null;
  for(let d=0;d<7;d+=0.05){
    const p=camera.position.clone().add(dir.clone().multiplyScalar(d));
    const bx=Math.floor(p.x),by=Math.floor(p.y),bz=Math.floor(p.z);
    if(by>=0&&by<CHUNK_HEIGHT&&getBlock(bx,by,bz)!==BLOCK.air){
      return{x:bx,y:by,z:bz,px:prevPt?prevPt.x:bx,py:prevPt?prevPt.y:by-1,pz:prevPt?prevPt.z:bz};
    }
    prevPt={x:bx,y:by,z:bz};
  }
  return null;
}

document.addEventListener('mousedown',e=>{
  if(document.pointerLockElement!==renderer.domElement)return;
  const h=getTarget();if(!h)return;
  if(e.button===0){const b=getBlock(h.x,h.y,h.z);if(b&&b!==BLOCK.bedrock){setBlock(h.x,h.y,h.z,BLOCK.air);rebuildNear(h.x,h.y,h.z);}}
  if(e.button===2){
    const px=h.px,py=h.py,pz=h.pz;
    const pp=player.pos;
    const inPlayer=Math.floor(pp.x)===px&&Math.floor(pp.z)===pz&&(Math.floor(pp.y)===py||Math.floor(pp.y+player.h)===py);
    if(!inPlayer){setBlock(px,py,pz,BLOCK[PLACEABLE[player.slot]]);rebuildNear(px,py,pz);}
  }
});
document.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('wheel',e=>{
  if(e.deltaY>0)player.slot=(player.slot+1)%PLACEABLE.length;
  else player.slot=(player.slot-1+PLACEABLE.length)%PLACEABLE.length;
  updateHotbar();
});

function setBlock(wx,wy,wz,type){
  if(wy<0||wy>=CHUNK_HEIGHT)return;
  const cx=Math.floor(wx/CHUNK_SIZE),cz=Math.floor(wz/CHUNK_SIZE);
  const data=chunks.get(chunkKey(cx,cz));if(!data)return;
  const lx=((wx%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE,lz=((wz%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE;
  data[lx+CHUNK_SIZE*(wy+CHUNK_HEIGHT*lz)]=typeof type==='string'?BLOCK[type]||type:type;
}

function rebuildNear(wx,wy,wz){
  const cx=Math.floor(wx/CHUNK_SIZE),cz=Math.floor(wz/CHUNK_SIZE);
  buildChunkMesh(cx,cz);
  const lx=((wx%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE,lz=((wz%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE;
  if(lx===0||lx>=CHUNK_SIZE-1){buildChunkMesh(cx+(lx===0?-1:1),cz);}
  if(lz===0||lz>=CHUNK_SIZE-1){buildChunkMesh(cx,cz+(lz===0?-1:1));}
}

function collides(x,y,z){
  const hw=player.w;
  for(let dx=-hw;dx<=hw;dx+=hw*2){
    for(let dz=-hw;dz<=hw;dz+=hw*2){
      for(let dy=0;dy<player.h;dy+=player.h){
        const b=getBlock(Math.floor(x+dx),Math.floor(y+dy),Math.floor(z+dz));
        if(b&&b!==BLOCK.air&&b!==BLOCK.water)return true;
      }
    }
  }
  return false;
}

function updatePlayer(dt){
  dt=Math.min(dt,0.05);
  const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const rgt=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  let mx=0,mz2=0;
  if(keys['KeyW']){mx+=fwd.x;mz2+=fwd.z;}if(keys['KeyS']){mx-=fwd.x;mz2-=fwd.z;}
  if(keys['KeyA']){mx-=rgt.x;mz2-=rgt.z;}if(keys['KeyD']){mx+=rgt.x;mz2+=rgt.z;}
  const len=Math.sqrt(mx*mx+mz2*mz2);if(len>0){mx/=len;mz2/=len;}
  const spd=MOVE_SPEED*(keys['ShiftLeft']?SPRINT_MULT:1);
  player.vel.x=mx*spd;player.vel.z=mz2*spd;player.vel.y+=GRAVITY*dt;
  if(keys['Space']&&player.onGround){player.vel.y=JUMP_VEL;player.onGround=false;}

  let nx=player.pos.x+player.vel.x*dt;if(!collides(nx,player.pos.y,player.pos.z))player.pos.x=nx;else player.vel.x=0;
  let nz=player.pos.z+player.vel.z*dt;if(!collides(player.pos.x,player.pos.y,nz))player.pos.z=nz;else player.vel.z=0;
  let ny=player.pos.y+player.vel.y*dt;if(!collides(player.pos.x,ny,player.pos.z)){player.pos.y=ny;player.onGround=false;}else{if(player.vel.y<0)player.onGround=true;player.vel.y=0;}
  if(player.pos.y<-10){player.pos.set(0.5,40,0.5);player.vel.set(0,0,0);}

  camera.position.copy(player.pos);camera.position.y+=player.h;
  camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;
}

// --- Hotbar UI ---
const hotbarEl=document.getElementById('hotbar');
function updateHotbar(){
  hotbarEl.innerHTML='';
  PLACEABLE.forEach((name,i)=>{
    const s=document.createElement('div');s.className='slot'+(i===player.slot?' active':'');
    s.style.backgroundColor=BLOCK_COLORS[name]+'44';s.textContent=name;hotbarEl.appendChild(s);
  });
}
updateHotbar();

// --- Highlight ---
const hlMesh=new THREE.Mesh(new THREE.BoxGeometry(1.005,1.005,1.005),new THREE.MeshBasicMaterial({wireframe:true,color:0x000000,transparent:true,opacity:0.4}));
scene.add(hlMesh);hlMesh.visible=false;

// --- Chunk Loading ---
let pcx=null,pcz=null;
function updateChunks(){
  const cx=Math.floor(player.pos.x/CHUNK_SIZE),cz=Math.floor(player.pos.z/CHUNK_SIZE);
  if(cx===pcx&&cz===pcz)return;pcx=cx;pcz=cz;
  for(let dx=-RENDER_DIST;dx<=RENDER_DIST;dx++)for(let dz=-RENDER_DIST;dz<=RENDER_DIST;dz++){
    if(dx*dx+dz*dz>RENDER_DIST*RENDER_DIST)continue;generateChunkData(cx+dx,cz+dz);buildChunkMesh(cx+dx,cz+dz);}
  for(const[key,mesh]of chunkMeshes){if(!chunks.has(key)){scene.remove(mesh);chunkMeshes.delete(key);}}
}
updateChunks();

// --- Game Loop ---
let lastTime=performance.now(),fpsFrames=0,fpsTime=0,fpsDisplay=0;
const infoEl=document.getElementById('info');

function tick(){
  requestAnimationFrame(tick);
  const now=performance.now(),dt=(now-lastTime)/1000;lastTime=now;
  fpsFrames++;fpsTime+=dt;if(fpsTime>=0.5){fpsDisplay=Math.round(fpsFrames/fpsTime);fpsFrames=0;fpsTime=0;}

  updatePlayer(dt);updateChunks();
  const h=getTarget();if(h){hlMesh.position.set(h.x+0.5,h.y+0.5,h.z+0.5);hlMesh.visible=true;}else{hlMesh.visible=false;}

  infoEl.innerHTML='FPS: '+fpsDisplay+'<br>XYZ: '+player.pos.x.toFixed(1)+' / '+player.pos.y.toFixed(1)+' / '+player.pos.z.toFixed(1)
    +'<br><b>'+PLACEABLE[player.slot]+'</b><br><br><b>Click</b> to lock mouse<br><b>WASD</b> Move | <b>Space</b> Jump<br><b>Shift</b> Sprint | <b>LMB</b> Break<br><b>RMB</b> Place | <b>Scroll/1-8</b> Select';
  renderer.render(scene,camera);
}

// Spawn player on surface
const spawnH=getHeight(0,0);
player.pos.set(0.5, Math.max(spawnH+3, 25), 0.5);
camera.position.copy(player.pos);camera.position.y+=player.h;

tick();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
