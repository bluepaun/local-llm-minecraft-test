<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial,sans-serif}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:100}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff}
#crosshair::before{width:2px;height:20px;left:50%;transform:translateX(-50%)}
#crosshair::after{width:20px;height:2px;top:50%;transform:translateY(-50%)}
#hotbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(0,0,0,0.5);padding:8px;border-radius:4px;z-index:100}
.hotbar-slot{width:50px;height:50px;border:2px solid #555;background:#222;display:flex;align-items:center;justify-content:center;position:relative}
.hotbar-slot.selected{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,0.5)}
.hotbar-slot span{position:absolute;bottom:2px;right:4px;font-size:10px;color:#aaa}
.block-preview{width:36px;height:36px}
#info{position:fixed;top:10px;left:10px;color:#fff;font-size:14px;z-index:100;text-shadow:1px 1px 2px #000}
#instructions{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#fff;padding:30px;border-radius:8px;text-align:center;z-index:200;max-width:400px}
#instructions h1{font-size:24px;margin-bottom:20px}
#instructions p{margin:10px 0;text-align:left}
#instructions button{margin-top:20px;padding:12px 30px;font-size:16px;cursor:pointer;background:#4a4;color:#fff;border:none;border-radius:4px}
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="info">
<div>WASD: Move | Space: Jump | Mouse: Look</div>
<div>Left Click: Break | Right Click: Place | 1-9: Select Block</div>
<div>E: Toggle Pointer Lock</div>
</div>
<div id="instructions">
<h1>Minecraft Clone</h1>
<p><b>WASD</b> - Move around</p>
<p><b>Space</b> - Jump</p>
<p><b>Mouse</b> - Look around</p>
<p><b>Left Click</b> - Break block</p>
<p><b>Right Click</b> - Place block</p>
<p><b>1-9</b> - Select block type</p>
<p><b>E</b> - Toggle pointer lock</p>
<button type="button" onclick="document.getElementById('instructions').style.display='none'">Click to Play</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLORS={
grass:[139,69,19],
dirt:[101,67,33],
stone:[128,128,128],
wood:[101,67,33],
leaves:[34,139,34],
sand:[244,164,96],
water:[30,144,255],
brick:[178,34,34],
glass:[135,206,235,0.5],
planks:[188,152,98]
};
const BLOCKS=[
{name:'grass',color:[139,69,19],top:[76,187,76],bottom:[101,67,33]},
{name:'dirt',color:[101,67,33]},
{name:'stone',color:[128,128,128]},
{name:'wood',color:[101,67,33]},
{name:'leaves',color:[34,139,34],transparent:true},
{name:'sand',color:[244,164,96]},
{name:'water',color:[30,144,255,0.5],transparent:true},
{name:'brick',color:[178,34,34]},
{name:'glass',color:[135,206,235,0.5],transparent:true},
{name:'planks',color:[188,152,98]}
];
class World{
constructor(){
this.chunks=new Map();
this.chunkSize=16;
this.chunkHeight=32;
this.blocks=new Map;
}
posKey(x,y,z){return`${x},${y},${z}`;}
getBlock(x,y,z){
if(y<0||y>=this.chunkHeight)return null;
return this.blocks.get(this.posKey(x,y,z));
}
setBlock(x,y,z,type){
if(y<0||y>=this.chunkHeight)return;
if(type===null)this.blocks.delete(this.posKey(x,y,z));
else this.blocks.set(this.posKey(x,y,z),type);
}
generate(){
for(let x=-16;x<16;x++){
for(let z=-16;z<16;z++){
const h=Math.floor(Math.sin(x*0.1)*2+Math.cos(z*0.1)*2+5);
for(let y=0;y<=h;y++){
this.setBlock(x,y,z,y===h?0:1);
}
for(let y=h-3;y<h;y++)this.setBlock(x,y,z,1);
}
}
}
}
class Game{
constructor(){
this.scene=new THREE.Scene();
this.scene.background=new THREE.Color(0x87CEEB);
this.scene.fog=new THREE.Fog(0x87CEEB,50,150);
this.camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
this.renderer=new THREE.WebGLRenderer({antialias:true});
this.renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(this.renderer.domElement);
const ambLight=new THREE.AmbientLight(0xffffff,0.6);
this.scene.add(ambLight);
const dirLight=new THREE.DirectionalLight(0xffffff,0.8);
dirLight.position.set(50,100,50);
this.scene.add(dirLight);
this.world=new World();
this.world.generate();
this.position=new THREE.Vector3(0,20,0);
this.velocity=new THREE.Vector3();
this.rotation=new THREE.Euler(0,0,0,'YXZ');
this.keys={};
this.blocksMesh=new THREE.Group();
this.scene.add(this.blocksMesh);
this.materials=BLOCKS.map(b=>{
const mat=new THREE.MeshLambertMaterial({transparent:b.transparent||false,opacity:b.transparent?0.5:1});
return mat;
});
this.materials[0].color.setRGB(...BLOCKS[0].top.map(c=>c/255));
this.materials[1].color.setRGB(101/255,67/255,33/255);
this.materials[2].color.setRGB(128/255,128/255,128/255);
this.materials[3].color.setRGB(101/255,67/255,33/255);
this.materials[4].color.setRGB(34/255,139/255,34/255);
this.materials[5].color.setRGB(244/255,164/255,96/255);
this.materials[6].color.setRGB(30/255,144/255,255/255);
this.materials[7].color.setRGB(178/255,34/255,34/255);
this.materials[8].color.setRGB(135/255,206/255,235/255);
this.materials[9].color.setRGB(188/255,152/255,98/255);
this.cubes=new Map();
this.selectedBlock=0;
this.onGround=false;
this.gravity=-25;
this.jumpForce=8;
this.speed=5;
this.buildCube();
this.setupEvents();
this.createHotbar();
this.animate();
}
buildCube(){
const geo=new THREE.BoxGeometry(1,1,1);
this.cubeGeo=geo;
}
createHotbar(){
const hotbar=document.getElementById('hotbar');
BLOCKS.forEach((b,i)=>{
const slot=document.createElement('div');
slot.className='hotbar-slot'+(i===0?' selected':'');
slot.dataset.block=i;
slot.style.cssText='background:#'+(i===0?'555':'#222');
slot.innerHTML=`<div class="block-preview" style="background:${this.getBlockStyle(i)}"></div><span>${i+1}</span>`;
slot.onclick=()=>this.selectBlock(i);
hotbar.appendChild(slot);
});
}
getBlockStyle(i){
const b=BLOCKS[i];
if(Array.isArray(b.color)&&b.color.length===4)return`rgba(${b.color[0]},${b.color[1]},${b.color[2]},0.7)`;
return`rgb(${b.color[0]},${b.color[1]},${b.color[2]})`;
}
selectBlock(i){
this.selectedBlock=i;
document.querySelectorAll('.hotbar-slot').forEach((s,idx)=>{
s.classList.toggle('selected',idx===i);
s.style.background=idx===i?'#555':'#222';
});
}
setupEvents(){
document.addEventListener('keydown',e=>{this.keys[e.code]=true;this.handleKey(e);});
document.addEventListener('keyup',e=>this.keys[e.code]=false);
document.addEventListener('mousemove',e=>this.handleMouse(e));
document.addEventListener('click',()=>{
if(document.pointerLockElement!==this.renderer.domElement){
this.renderer.requestPointerLock();
}else this.breakBlock();
});
document.addEventListener('contextmenu',e=>{e.preventDefault();this.placeBlock();});
document.addEventListener('pointerlockchange',()=>{});
window.addEventListener('resize',()=>{
this.camera.aspect=window.innerWidth/window.innerHeight;
this.camera.updateProjectionMatrix();
this.renderer.setSize(window.innerWidth,window.innerHeight);
});
}
handleKey(e){
if(e.code==='KeyE'){
if(document.pointerLockElement)this.renderer.requestPointerLock();
}
if(e.code==='Space'&&this.onGround){
this.velocity.y=this.jumpForce;
this.onGround=false;
}
if(e.code>='Digit1'&&e.code<='Digit9'){
this.selectBlock(parseInt(e.code.slice(-1))-1);
}
}
handleMouse(e){
if(document.pointerLockElement!==this.renderer.domElement)return;
this.rotation.y-=e.movementX*0.002;
this.rotation.x-=e.movementY*0.002;
this.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,this.rotation.x));
}
breakBlock(){
const dir=new THREE.Vector3(0,0,-1);
dir.applyEuler(this.rotation);
const pos=this.camera.position.clone().add(dir.multiplyScalar(5));
const blockPos=new THREE.Vector3(Math.round(pos.x),Math.round(pos.y),Math.round(pos.z));
const key=this.world.posKey(blockPos.x,blockPos.y,blockPos.z);
if(this.world.blocks.has(key)){
this.world.blocks.delete(key);
this.updateMesh();
}
}
placeBlock(){
const dir=new THREE.Vector3(0,0,-1);
dir.applyEuler(this.rotation);
const pos=this.camera.position.clone().add(dir.multiplyScalar(2));
const blockPos=new THREE.Vector3(Math.floor(pos.x),Math.floor(pos.y),Math.floor(pos.z));
if(!this.world.blocks.has(this.world.posKey(blockPos.x,blockPos.y,blockPos.z))){
this.world.setBlock(blockPos.x,blockPos.y,blockPos.z,this.selectedBlock);
this.updateMesh();
}
}
updateMesh(){
while(this.blocksMesh.children.length)this.blocksMesh.remove(this.blocksMesh.children[0]);
const geo=new THREE.BoxGeometry(1,1,1);
this.world.blocks.forEach((type,key)=>{
const[x,y,z]=key.split(',').map(Number);
const mesh=new THREE.Mesh(geo,this.materials[type]);
mesh.position.set(x+0.5,y+0.5,z+0.5);
this.blocksMesh.add(mesh);
});
}
update(dt){
const move=new THREE.Vector3();
if(this.keys['KeyW'])move.z=-1;
if(this.keys['KeyS'])move.z=1;
if(this.keys['KeyA'])move.x=-1;
if(this.keys['KeyD'])move.x=1;
move.applyAxisAngle(new THREE.Vector3(0,1,0),this.rotation.y);
move.normalize();
this.velocity.x=move.x*this.speed;
this.velocity.z=move.z*this.speed;
this.velocity.y+=this.gravity*dt;
const newPos=this.position.clone();
newPos.x+=this.velocity.x*dt;
newPos.z+=this.velocity.z*dt;
newPos.y+=this.velocity.y*dt;
const checkCollision=(x,y,z)=>this.world.getBlock(Math.floor(x),Math.floor(y),Math.floor(z))!==null;
if(!checkCollision(newPos.x,this.position.y,this.position.z))this.position.x=newPos.x;
if(!checkCollision(this.position.x,this.position.y,newPos.z))this.position.z=newPos.z;
this.onGround=false;
if(checkCollision(this.position.x,newPos.y-1,this.position.z)){
if(this.velocity.y<0){
this.onGround=true;
this.velocity.y=0;
}
}else{
this.position.y=newPos.y;
}
this.camera.position.copy(this.position);
this.camera.rotation.set(this.rotation.x,this.rotation.y,0,undefined);
}
animate(){
requestAnimationFrame(()=>this.animate());
const dt=1/60;
this.update(dt);
this.renderer.render(this.scene,this.camera);
}
}
new Game();
</script>
</body>
</html>
