<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft HTML</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        #hotbar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            z-index: 100;
        }
        .hotbar-slot {
            width: 50px;
            height: 50px;
            border: 3px solid #555;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .hotbar-slot.active { border-color: #fff; transform: scale(1.1); }
        .hotbar-slot:hover { border-color: #aaa; }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }
        #instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 200;
        }
        #instructions h1 { margin-bottom: 20px; }
        #instructions p { margin: 10px 0; }
        #instructions .key { background: #444; padding: 4px 8px; border-radius: 4px; margin: 2px; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="crosshair"></div>
    <div id="hotbar"></div>
    <div id="info">
        FPS: <span id="fps">0</span><br>
        Blocks: <span id="block-count">0</span><br>
        X: <span id="pos-x">0</span> Y: <span id="pos-y">0</span> Z: <span id="pos-z">0</span>
    </div>
    <div id="instructions">
        <h1>Minecraft HTML</h1>
        <p><span class="key">CLICK</span> to start</p>
        <p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> - Move</p>
        <p><span class="key">SPACE</span> - Jump</p>
        <p><span class="key">SHIFT</span> - Descend</p>
        <p><span class="key">MOUSE</span> - Look around</p>
        <p><span class="key">L-CLICK</span> - Destroy block</p>
        <p><span class="key">R-CLICK</span> - Place block</p>
        <p><span class="key">1-8</span> - Select block type</p>
        <p><span class="key">ESC</span> - Release mouse</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const gl = canvas.getContext('webgl');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let camera, scene, renderer;
        let blocks = new Map();
        let blockMeshes = [];
        let selectedBlockType = 1;
        let isLocked = false;

        // Player state
        const player = {
            position: new THREE.Vector3(0, 10, 0),
            velocity: new THREE.Vector3(),
            height: 1.8,
            radius: 0.3,
            speed: 5,
            jumpForce: 8,
            gravity: 20,
            onGround: false
        };

        // Camera rotation
        let pitch = 0;
        let yaw = 0;

        // Block types
        const blockTypes = [
            { name: 'Air', color: 0x000000, transparent: true },
            { name: 'Grass', color: 0x567d46 },
            { name: 'Dirt', color: 0x8b4513 },
            { name: 'Stone', color: 0x808080 },
            { name: 'Wood', color: 0x654321 },
            { name: 'Leaves', color: 0x228b22 },
            { name: 'Sand', color: 0xf4a460 },
            { name: 'Water', color: 0x1e90ff, transparent: true, opacity: 0.7 },
            { name: 'Brick', color: 0xb22222 },
            { name: 'Glass', color: 0xadd8e6, transparent: true, opacity: 0.3 }
        ];

        // Input state
        const keys = {};
        const mouse = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

            camera = new THREE.PerspectiveCamera(75, canvas.width / canvas.height, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.width, canvas.height);
            renderer.setPixelRatio(window.devicePixelRatio);

            setupLighting();
            generateWorld();
            createHotbar();
            setupEvents();
            
            updatePlayerPosition();
        }

        function setupLighting() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(50, 100, 50);
            scene.add(directional);
        }

        function generateWorld() {
            const worldSize = 32;
            
            for (let x = -worldSize/2; x < worldSize/2; x++) {
                for (let z = -worldSize/2; z < worldSize/2; z++) {
                    const height = Math.floor(Math.sin(x * 0.1) * 3 + Math.cos(z * 0.1) * 3 + 5);
                    
                    for (let y = 0; y < height; y++) {
                        let blockType = 3;
                        if (y === height - 1) blockType = 2;
                        else if (y === height - 2) blockType = 2;
                        
                        createBlock(x, y, z, blockType);
                    }
                    
                    if (height < 4) {
                        for (let y = height; y < 4; y++) {
                            createBlock(x, y, z, 8);
                        }
                    }
                }
            }

            createTree(0, 10, 0);
        }

        function createTree(x, y, z) {
            const trunkHeight = 5;
            
            for (let i = 0; i < trunkHeight; i++) {
                createBlock(x, y + i, z, 5);
            }
            
            for (let lx = -2; lx <= 2; lx++) {
                for (let lz = -2; lz <= 2; lz++) {
                    for (let ly = trunkHeight - 1; ly <= trunkHeight + 1; ly++) {
                        if (Math.abs(lx) + Math.abs(lz) < 3 && !(lx === 0 && lz === 0 && ly < trunkHeight)) {
                            createBlock(x + lx, y + ly, z + lz, 6);
                        }
                    }
                }
            }
        }

        function createBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocks.has(key)) return;

            blocks.set(key, type);
            updateBlockMesh(x, y, z, type);
        }

        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            if (!blocks.has(key)) return false;

            blocks.delete(key);
            
            for (let i = 0; i < blockMeshes.length; i++) {
                const mesh = blockMeshes[i];
                if (Math.round(mesh.position.x) === x && 
                    Math.round(mesh.position.y) === y && 
                    Math.round(mesh.position.z) === z) {
                    scene.remove(mesh);
                    blockMeshes.splice(i, 1);
                    break;
                }
            }

            return true;
        }

        function updateBlockMesh(x, y, z, type) {
            const key = `${x},${y},${z}`;
            
            let shouldExist = blocks.has(key);
            let existingMesh = blockMeshes.find(m => 
                Math.round(m.position.x) === x && 
                Math.round(m.position.y) === y && 
                Math.round(m.position.z) === z
            );

            if (!shouldExist && existingMesh) {
                scene.remove(existingMesh);
                blockMeshes = blockMeshes.filter(m => m !== existingMesh);
                return;
            }

            if (shouldExist && !existingMesh) {
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = getBlockMaterial(type);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
                scene.add(mesh);
                blockMeshes.push(mesh);
            } else if (shouldExist) {
                existingMesh.material = getBlockMaterial(type);
            }
        }

        function getBlockMaterial(type) {
            const blockInfo = blockTypes[type];
            let material;
            
            if (blockInfo.transparent) {
                material = new THREE.MeshLambertMaterial({ 
                    color: blockInfo.color,
                    transparent: true,
                    opacity: blockInfo.opacity || 0.5,
                    side: THREE.DoubleSide
                });
            } else {
                material = new THREE.MeshLambertMaterial({ color: blockInfo.color });
            }

            return material;
        }

        function createHotbar() {
            const hotbar = document.getElementById('hotbar');
            hotbar.innerHTML = '';

            for (let i = 1; i < blockTypes.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'hotbar-slot' + (i === selectedBlockType ? ' active' : '');
                slot.style.backgroundColor = '#' + blockTypes[i].color.toString(16).padStart(6, '0');
                slot.dataset.type = i;
                hotbar.appendChild(slot);
            }
        }

        function updateHotbar() {
            const slots = document.querySelectorAll('.hotbar-slot');
            slots.forEach((slot, index) => {
                slot.classList.remove('active');
                if (index + 1 === selectedBlockType) {
                    slot.classList.add('active');
                }
            });
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                camera.aspect = canvas.width / canvas.height;
                camera.updateProjectionMatrix();
                renderer.setSize(canvas.width, canvas.height);
            });

            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                
                if (e.code >= 'Digit1' && e.code <= 'Digit8') {
                    selectedBlockType = parseInt(e.code.replace('Digit', ''));
                    updateHotbar();
                }
            });

            document.addEventListener('keyup', (e) => keys[e.code] = false);

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;

                const sensitivity = 0.002;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;
                pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
            });

            canvas.addEventListener('click', (e) => {
                if (!isLocked) {
                    canvas.requestPointerLock();
                    return;
                }

                if (e.button === 0) {
                    raycast(true);
                } else if (e.button === 2) {
                    raycast(false);
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === canvas;
                document.getElementById('instructions').style.display = isLocked ? 'none' : 'block';
            });

            document.addEventListener('contextmenu', e => e.preventDefault());
        }

        function raycast(destroy) {
            const raycaster = new THREE.Raycaster();
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            raycaster.set(player.position.clone().add(new THREE.Vector3(0, 1.5, 0)), direction);

            const intersects = raycaster.intersectObjects(blockMeshes);
            
            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];
                const mesh = intersect.object;
                
                const x = Math.round(mesh.position.x - 0.5);
                const y = Math.round(mesh.position.y - 0.5);
                const z = Math.round(mesh.position.z - 0.5);

                if (destroy) {
                    removeBlock(x, y, z);
                    
                    const key = `${x},${y},${z}`;
                    blocks.delete(key);
                } else {
                    const nx = x + Math.round(intersect.face.normal.x);
                    const ny = y + Math.round(intersect.face.normal.y);
                    const nz = z + Math.round(intersect.face.normal.z);
                    
                    if (!isPositionOccupied(nx, ny, nz)) {
                        createBlock(nx, ny, nz, selectedBlockType);
                    }
                }
            }
        }

        function isPositionOccupied(x, y, z) {
            return blocks.has(`${x},${y},${z}`) || 
                   (Math.round(player.position.x) === x && Math.abs(player.position.y - (y + 0.5)) < 1.8 && Math.round(player.position.z) === z);
        }

        function updatePlayerPosition() {
            camera.position.copy(player.position);
            camera.position.y += 1.6;
            camera.rotation.set(0, 0, 0);
            camera.rotateY(yaw);
            camera.rotateX(pitch);
        }

        function updatePhysics(delta) {
            const speed = player.speed;
            const direction = new THREE.Vector3();

            if (keys['KeyW']) direction.z -= 1;
            if (keys['KeyS']) direction.z += 1;
            if (keys['KeyA']) direction.x -= 1;
            if (keys['KeyD']) direction.x += 1;

            if (direction.length() > 0) {
                direction.normalize();
                
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0;
                camDir.normalize();
                
                const camRight = new THREE.Vector3();
                camRight.crossVectors(camera.up, camDir).normalize();

                const moveDir = new THREE.Vector3();
                moveDir.addScaledVector(camDir, -direction.z);
                moveDir.addScaledVector(camRight, direction.x);
                moveDir.normalize();

                player.velocity.x = moveDir.x * speed;
                player.velocity.z = moveDir.z * speed;
            } else {
                player.velocity.x *= 0.8;
                player.velocity.z *= 0.8;
            }

            if ((keys['Space'] || keys['KeySpace']) && player.onGround) {
                player.velocity.y = player.jumpForce;
                player.onGround = false;
            }

            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                player.velocity.y -= 5 * delta;
            }

            player.velocity.y -= player.gravity * delta;

            
            const testPos = player.position.clone();
            
            testPos.x += player.velocity.x * delta;
            if (checkCollision(testPos)) {
                player.velocity.x = 0;
            } else {
                player.position.x += player.velocity.x * delta;
            }

            testPos.set(player.position.x, player.position.y + player.velocity.y * delta, player.position.z);
            testPos.y = Math.max(0.5, testPos.y);
            
            if (checkCollision(testPos)) {
                if (player.velocity.y < 0) {
                    player.onGround = true;
                }
                player.velocity.y = 0;
            } else {
                player.position.y += player.velocity.y * delta;
                player.onGround = false;
            }

            testPos.set(player.position.x, player.position.y, player.position.z + player.velocity.z * delta);
            if (checkCollision(testPos)) {
                player.velocity.z = 0;
            } else {
                player.position.z += player.velocity.z * delta;
            }

            if (player.position.y < -10) {
                player.position.set(0, 20, 0);
                player.velocity.set(0, 0, 0);
            }

            updatePlayerPosition();
        }

        function checkCollision(position) {
            const px = Math.round(position.x);
            const py1 = Math.round(position.y);
            const py2 = Math.round(position.y + 1.6);
            const pz = Math.round(position.z);
            

            for (let y = py1; y <= py2; y++) {
                if (blocks.has(`${px},${y},${pz}`)) {
                    const blockPos = new THREE.Vector3(px + 0.5, y + 0.5, pz + 0.5);
                    const dist = Math.sqrt(
                        Math.pow(position.x - blockPos.x, 2) +
                        Math.pow(position.y + 0.8 - blockPos.y, 2) +
                        Math.pow(position.z - blockPos.z, 2)
                    );
                    if (dist < 0.8) return true;
                }
            }
            return false;
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let fpsTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            
            frameCount++;
            fpsTime += delta;
            if (fpsTime >= 1) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                fpsTime = 0;
            }

            updatePhysics(delta);

            
            document.getElementById('block-count').textContent = blocks.size;
            document.getElementById('pos-x').textContent = player.position.x.toFixed(1);
            document.getElementById('pos-y').textContent = player.position.y.toFixed(1);
            document.getElementById('pos-z').textContent = player.position.z.toFixed(1);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
