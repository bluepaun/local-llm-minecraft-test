<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minecraft Clone (single HTML file)</title>
<style>
  body { margin:0; overflow:hidden; font-family:sans-serif; }
   #instructions {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#fff; text-align:center; font-size:24px; cursor:pointer;
   }
</style>
</head>
<body>
<div id="instructions">Click to play<br>(WASD = move, mouse = look)<br>Left-click = place, Right-click = destroy</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/PointerLockControls.js';

let camera, scene, renderer, controls;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let raycaster = new THREE.Raycaster();
const world = new THREE.Group();  // holds all blocks

init();
animate();

function init() {
   // scene and camera
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);  // sky blue

  camera = new THREE.PerspectiveCamera(75,
    window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 5);

   // renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

   // lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);
  const directional = new THREE.DirectionalLight(0xffffff, 0.7);
  directional.position.set(5, 10, 7);
  scene.add(directional);

   // block geometry & material (green "grass")
  const blockGeo = new THREE.BoxGeometry(1, 1, 1);
  const blockMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });

   // ground (a flat field of grass blocks)
  for (let x = -10; x <= 10; x++) {
    for (let z = -10; z <= 10; z++) {
      const block = new THREE.Mesh(blockGeo, blockMat);
      block.position.set(x, 0, z);
      world.add(block);
     }
   }
  scene.add(world);

   // pointer lock controls
  controls = new PointerLockControls(camera, document.body);
  document.body.addEventListener('click', () => controls.lock());

  controls.addEventListener('lock', () => {
    document.getElementById('instructions').style.display = 'none';
   });
  controls.addEventListener('unlock', () => {
    document.getElementById('instructions').style.display = '';
   });

   // keyboard movement
  const onKeyDown = (event) => {
    switch (event.code) {
      case 'KeyW':
      case 'ArrowUp':
        moveForward = true; break;
      case 'KeyS':
      case 'ArrowDown':
        moveBackward = true; break;
      case 'KeyA':
      case 'ArrowLeft':
        moveLeft = true; break;
      case 'KeyD':
      case 'ArrowRight':
        moveRight = true; break;
     }
   };
  const onKeyUp = (event) => {
    switch (event.code) {
      case 'KeyW':
      case 'ArrowUp':
        moveForward = false; break;
      case 'KeyS':
      case 'ArrowDown':
        moveBackward = false; break;
      case 'KeyA':
      case 'ArrowLeft':
        moveLeft = false; break;
      case 'KeyD':
      case 'ArrowRight':
        moveRight = false; break;
     }
   };
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

   // block placement & removal
  document.addEventListener('mousedown', (event) => {
    if (!controls.isLocked) return;  // only when cursor is locked
     // cast a ray forward from the camera
    raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
    const intersects = raycaster.intersectObjects(world.children);
    if (intersects.length === 0) return;
    const intersect = intersects[0];
    const normal = intersect.face.normal.clone();
    const pos = intersect.point.clone().add(normal.multiplyScalar(0.5));
     // round to nearest integer to snap blocks onto a grid
    const x = Math.round(pos.x);
    const y = Math.round(pos.y);
    const z = Math.round(pos.z);

    if (event.button === 0) {  // left click: place
      const newBlock = new THREE.Mesh(blockGeo, blockMat);
      newBlock.position.set(x, y, z);
      world.add(newBlock);
     } else if (event.button === 2) {  // right click: destroy
      world.remove(intersect.object);
     }
   });
   // disable context menu on right click
  document.addEventListener('contextmenu', (event) => event.preventDefault());

   // handle window resizing
  window.addEventListener('resize', onWindowResize, false);
}
function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(0.05, renderer.info.render.frame * 0.016);  // approximate delta time

   // move camera based on keys
  const speed = 5;  // units per second
  if (moveForward) controls.moveForward(speed * delta);
  if (moveBackward) controls.moveForward(-speed * delta);
  if (moveLeft) controls.moveRight(-speed * delta);
  if (moveRight) controls.moveRight(speed * delta);

  renderer.render(scene, camera);
}
</script>
</body>
</html>
