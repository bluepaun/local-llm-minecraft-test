<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelCraft</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Press Start 2P', monospace;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
        }

        #crosshair::before {
            width: 20px;
            height: 2px;
            left: -10px;
            top: -1px;
        }

        #crosshair::after {
            width: 2px;
            height: 20px;
            left: -1px;
            top: -10px;
        }

        #hotbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            z-index: 100;
        }

        .hotbar-slot {
            width: 50px;
            height: 50px;
            background: rgba(80,80,80,0.8);
            border: 2px solid rgba(50,50,50,0.8);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .hotbar-slot.selected {
            border-color: white;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .hotbar-slot canvas {
            width: 40px;
            height: 40px;
            image-rendering: pixelated;
        }

        .hotbar-slot .key-hint {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 8px;
            color: rgba(255,255,255,0.6);
        }

        #start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: white;
        }

        #start-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0 #0f0f1a;
            letter-spacing: 4px;
        }

        #start-screen h1 span { color: #4ecca3; }

        #start-screen .controls-info {
            margin: 30px 0;
            font-size: 10px;
            line-height: 2.5;
            text-align: center;
            color: rgba(255,255,255,0.7);
        }

        #start-btn {
            font-family: inherit;
            font-size: 16px;
            padding: 20px 40px;
            background: #4ecca3;
            border: none;
            color: #1a1a2e;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(78, 204, 163, 0.5);
        }

        #coords {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 10px;
            z-index: 100;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>VOXEL<span>CRAFT</span></h1>
        <div class="controls-info">
            WASD - Move<br>
            MOUSE - Look<br>
            SPACE - Jump<br>
            LEFT CLICK - Break Block<br>
            RIGHT CLICK - Place Block<br>
            1-8 - Select Block
        </div>
        <button id="start-btn" type="button">CLICK TO PLAY</button>
    </div>

    <div id="game-container"></div>
    <div id="crosshair"></div>
    <div id="coords"></div>
    <div id="hotbar"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script>
    const BLOCK_TYPES = [
        { name: 'Grass', topColor: '#4c934c', sideColor: '#6b4423', bottomColor: '#6b4423' },
        { name: 'Dirt', topColor: '#6b4423', sideColor: '#6b4423', bottomColor: '#6b4423' },
        { name: 'Stone', topColor: '#808080', sideColor: '#707070', bottomColor: '#606060' },
        { name: 'Wood', topColor: '#8B4513', sideColor: '#654321', bottomColor: '#654321' },
        { name: 'Leaves', topColor: '#228B22', sideColor: '#1e7a1e', bottomColor: '#1a6b1a' },
        { name: 'Sand', topColor: '#f4d03f', sideColor: '#d4b833', bottomColor: '#c4a823' },
        { name: 'Brick', topColor: '#b22222', sideColor: '#8b1a1a', bottomColor: '#6b1212' },
        { name: 'Water', topColor: '#1e90ff', sideColor: '#1e90ff', bottomColor: '#1e90ff' }
    ];

    const WORLD_SIZE = 32;
    const BLOCK_SIZE = 1;

    let scene, camera, renderer;
    let world = {};
    let playerPos = new THREE.Vector3(WORLD_SIZE / 2, 20, WORLD_SIZE / 2);
    let playerVel = new THREE.Vector3(0, 0, 0);
    let yaw = 0, pitch = 0;
    let isLocked = false;
    let selectedBlockType = 0;
    let onGround = false;
    let keys = {};
    let blockMeshes = {};

    function createTexture(color, isTransparent = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 16;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');

        if (isTransparent) {
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 16, 16);
        } else {
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 16, 16);

            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < 16; i++) {
                for (let j = 0; j < 16; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
            }

            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.fillRect(0, 0, 16, 2);
            ctx.fillRect(0, 0, 2, 16);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.magFilter = THREE.NearestFilter;
        texture.minFilter = THREE.NearestFilter;
        return texture;
    }

    function createBlockMaterials(blockType) {
        const bt = BLOCK_TYPES[blockType];
        const transparent = bt.transparent || false;

        const sideColor = new THREE.Color(bt.sideColor);
        const topColor = new THREE.Color(bt.topColor);
        const bottomColor = new THREE.Color(bt.bottomColor);

        return [
            new THREE.MeshLambertMaterial({ color: sideColor }),
            new THREE.MeshLambertMaterial({ color: sideColor }),
            new THREE.MeshLambertMaterial({ color: topColor }),
            new THREE.MeshLambertMaterial({ color: bottomColor }),
            new THREE.MeshLambertMaterial({ color: sideColor }),
            new THREE.MeshLambertMaterial({ color: sideColor })
        ];
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 80);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(playerPos);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('game-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        generateTerrain();
        createBlockMeshes();
        setupHotbar();
        setupEventListeners();

        animate();
    }

    function noise2D(x, z) {
        const X = Math.floor(x) & 255;
        const Z = Math.floor(z) & 255;
        return Math.sin(x * 0.1 + Z * 0.15) * Math.cos(x * 0.05 - z * 0.08) * 5;
    }

    function getHeight(x, z) {
        return Math.floor(8 + noise2D(x, z) + noise2D(x * 2, z * 2) * 0.5);
    }

    function generateTree(x, y, z) {
        for (let i = 1; i <= 4; i++) {
            setBlock(Math.floor(x), Math.floor(y + i), Math.floor(z), 3);
        }
        for (let dx = -2; dx <= 2; dx++) {
            for (let dy = -1; dy <= 2; dy++) {
                for (let dz = -2; dz <= 2; dz++) {
                    if (dx === 0 && dy >= 0 && dz === 0) continue;
                    if (Math.abs(dx) === 2 && Math.abs(dz) === 2) continue;
                    setBlock(Math.floor(x + dx), Math.floor(y + 4 + dy), Math.floor(z + dz), 4);
                }
            }
        }
        setBlock(Math.floor(x), Math.floor(y + 4), Math.floor(z), 4);
    }

    function setBlock(x, y, z, type) {
        const key = `${x},${y},${z}`;
        world[key] = type;
    }

    function getBlock(x, y, z) {
        const key = `${x},${y},${z}`;
        return world[key] !== undefined ? world[key] : -1;
    }

    function generateTerrain() {
        const waterLevel = 6;

        for (let x = 0; x < WORLD_SIZE; x++) {
            for (let z = 0; z < WORLD_SIZE; z++) {
                const height = getHeight(x, z);
                for (let y = 0; y <= height; y++) {
                    if (y === height) {
                        setBlock(x, y, z, 0);
                    } else if (y > height - 3) {
                        setBlock(x, y, z, 1);
                    } else {
                        setBlock(x, y, z, 2);
                    }
                }
                if (height < waterLevel) {
                    for (let y = height + 1; y <= waterLevel; y++) {
                        setBlock(x, y, z, 7);
                    }
                }
            }
        }

        for (let i = 0; i < 15; i++) {
            const tx = Math.floor(Math.random() * (WORLD_SIZE - 8)) + 4;
            const tz = Math.floor(Math.random() * (WORLD_SIZE - 8)) + 4;
            const height = getHeight(tx, tz);
            if (height >= waterLevel + 2) {
                generateTree(tx, height, tz);
            }
        }
    }

    function createBlockMesh(x, y, z, type) {
        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        const materials = createBlockMaterials(type);
        const mesh = new THREE.Mesh(geometry, materials);
        mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
        return mesh;
    }

    function createBlockMeshes() {
        Object.entries(world).forEach(([key, type]) => {
            const [x, y, z] = key.split(',').map(Number);
            const mesh = createBlockMesh(x, y, z, type);
            scene.add(mesh);
            blockMeshes[key] = mesh;
        });
    }

    function updateBlockMesh(x, y, z, type) {
        const key = `${x},${y},${z}`;
        if (blockMeshes[key]) {
            scene.remove(blockMeshes[key]);
            delete blockMeshes[key];
        }
        if (type >= 0) {
            const mesh = createBlockMesh(x, y, z, type);
            scene.add(mesh);
            blockMeshes[key] = mesh;
        }
    }

    function setupHotbar() {
        const hotbar = document.getElementById('hotbar');
        hotbar.innerHTML = '';
        BLOCK_TYPES.forEach((block, i) => {
            const slot = document.createElement('div');
            slot.className = 'hotbar-slot' + (i === 0 ? ' selected' : '');

            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 0, 32);
            if (block.transparent) {
                ctx.fillStyle = 'rgba(30, 144, 255, 0.7)';
                ctx.fillRect(0, 0, 32, 32);
            } else {
                grad.addColorStop(0, block.topColor);
                grad.addColorStop(1, block.sideColor);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 32, 32);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0, 0, 32, 4);
            ctx.fillRect(0, 0, 4, 32);

            slot.appendChild(canvas);

            const keyHint = document.createElement('span');
            keyHint.className = 'key-hint';
            keyHint.textContent = i + 1;
            slot.appendChild(keyHint);

            slot.addEventListener('click', () => selectBlock(i));
            hotbar.appendChild(slot);
        });
    }

    function selectBlock(index) {
        selectedBlockType = index;
        document.querySelectorAll('.hotbar-slot').forEach((slot, i) => {
            slot.classList.toggle('selected', i === index);
        });
    }

    function setupEventListeners() {
        document.getElementById('start-btn').addEventListener('click', startGame);

        document.addEventListener('mousemove', e => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
        });

        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit8') {
                selectBlock(parseInt(e.code.charAt(5)) - 1);
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        renderer.domElement.addEventListener('mousedown', e => {
            if (!isLocked) return;
            e.preventDefault();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const meshArray = Object.values(blockMeshes);
            const intersects = raycaster.intersectObjects(meshArray);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const pos = hit.object.position;

                if (e.button === 0) {
                    const bx = Math.floor(pos.x);
                    const by = Math.floor(pos.y);
                    const bz = Math.floor(pos.z);
                    if (by > 0) {
                        updateBlockMesh(bx, by, bz, -1);
                        delete world[`${bx},${by},${bz}`];
                    }
                } else if (e.button === 2) {
                    const normal = hit.face.normal;
                    const nx = Math.floor(pos.x + normal.x);
                    const ny = Math.floor(pos.y + normal.y);
                    const nz = Math.floor(pos.z + normal.z);

                    if (ny > 0 && ny < 50 && getBlock(nx, ny, nz) === -1) {
                        const px = Math.floor(playerPos.x);
                        const py = Math.floor(playerPos.y);
                        const pz = Math.floor(playerPos.z);
                        if (!(nx === px && nz === pz && (ny === py || ny === py + 1))) {
                            updateBlockMesh(nx, ny, nz, selectedBlockType);
                            setBlock(nx, ny, nz, selectedBlockType);
                        }
                    }
                }
            }
        });

        renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        renderer.domElement.requestPointerLock();
        isLocked = true;
    }

    function checkCollision(x, y, z) {
        const padding = 0.3;
        for (let dx = -padding; dx <= padding; dx += 0.3) {
            for (let dy = 0; dy <= 1.6; dy += 0.4) {
                for (let dz = -padding; dz <= padding; dz += 0.3) {
                    const bx = Math.floor(x + dx);
                    const by = Math.floor(y + dy);
                    const bz = Math.floor(z + dz);
                    if (getBlock(bx, by, bz) !== -1) {
                        return true;
                    }
                }
            }
        }
        return false;
    }

    function updatePlayer(dt) {
        if (!isLocked) return;

        const speed = 5;
        const moveDir = new THREE.Vector3();

        if (keys['KeyW']) moveDir.z -= 1;
        if (keys['KeyS']) moveDir.z += 1;
        if (keys['KeyA']) moveDir.x -= 1;
        if (keys['KeyD']) moveDir.x += 1;

        if (moveDir.length() > 0) {
            moveDir.normalize();
            moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            playerVel.x = moveDir.x * speed;
            playerVel.z = moveDir.z * speed;
        } else {
            playerVel.x *= 0.8;
            playerVel.z *= 0.8;
        }

        playerVel.y -= 20 * dt;
        if (playerVel.y < -20) playerVel.y = -20;

        const newX = playerPos.x + playerVel.x * dt;
        const newZ = playerPos.z + playerVel.z * dt;

        if (!checkCollision(newX, playerPos.y, playerPos.z)) {
            playerPos.x = newX;
        } else {
            playerVel.x = 0;
        }

        if (!checkCollision(playerPos.x, playerPos.y, newZ)) {
            playerPos.z = newZ;
        } else {
            playerVel.z = 0;
        }

        const newY = playerPos.y + playerVel.y * dt;
        if (!checkCollision(playerPos.x, newY, playerPos.z)) {
            playerPos.y = newY;
            onGround = false;
        } else {
            if (playerVel.y < 0) onGround = true;
            playerVel.y = 0;
        }

        if (keys['Space'] && onGround) {
            playerVel.y = 8;
            onGround = false;
        }

        if (playerPos.y < -10) {
            playerPos.set(WORLD_SIZE / 2, 20, WORLD_SIZE / 2);
            playerVel.set(0, 0, 0);
        }

        playerPos.x = Math.max(1, Math.min(WORLD_SIZE - 1, playerPos.x));
        playerPos.z = Math.max(1, Math.min(WORLD_SIZE - 1, playerPos.z));
    }

    function updateCamera() {
        camera.position.copy(playerPos);
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        document.getElementById('coords').textContent =
            `X: ${Math.floor(playerPos.x)} Y: ${Math.floor(playerPos.y)} Z: ${Math.floor(playerPos.z)}`;
    }

    let lastTime = performance.now();
    function animate() {
        requestAnimationFrame(animate);

        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        updatePlayer(dt);
        updateCamera();
        renderer.render(scene, camera);
    }

    init();
    </script>
</body>
</html>
