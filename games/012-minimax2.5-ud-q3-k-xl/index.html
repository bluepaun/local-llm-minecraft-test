<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxelCraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            z-index: 100;
        }
        #hotbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 100;
        }
        .hotbar-slot {
            width: 50px;
            height: 50px;
            background: rgba(50, 50, 50, 0.8);
            border: 2px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .hotbar-slot.selected {
            border-color: #fff;
            background: rgba(80, 80, 80, 0.9);
        }
        .hotbar-slot .block-icon {
            width: 36px;
            height: 36px;
            image-rendering: pixelated;
        }
        .hotbar-slot .slot-number {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 12px;
            color: #aaa;
        }
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
            z-index: 100;
            pointer-events: none;
        }
        #instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.8;
            z-index: 200;
            display: none;
            text-align: center;
        }
        #instructions h2 {
            margin-bottom: 15px;
            font-size: 24px;
        }
        #instructions .key {
            color: #4CAF50;
            font-weight: bold;
        }
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: #fff;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        #start-screen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000;
        }
        #start-screen p {
            font-size: 18px;
            margin-bottom: 30px;
        }
        #start-screen .click-prompt {
            font-size: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="crosshair">+</div>
        <div id="hotbar"></div>
        <div id="debug"></div>
        <div id="instructions">
            <h2>Controls</h2>
            <p><span class="key">W A S D</span> - Move</p>
            <p><span class="key">SPACE</span> - Jump</p>
            <p><span class="key">SHIFT</span> - Sneak</p>
            <p><span class="key">MOUSE</span> - Look around</p>
            <p><span class="key">LEFT CLICK</span> - Break block</p>
            <p><span class="key">RIGHT CLICK</span> - Place block</p>
            <p><span class="key">1-8</span> - Select block</p>
            <p><span class="key">SCROLL</span> - Cycle hotbar</p>
            <p><span class="key">H</span> - Toggle help</p>
            <p><span class="key">ESC</span> - Release mouse</p>
        </div>
        <div id="start-screen">
            <h1>VoxelCraft</h1>
            <p>A Minecraft-inspired voxel game</p>
            <p class="click-prompt">Click to play</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const BLOCK_TYPES = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            SAND: 4,
            WOOD: 5,
            LEAVES: 6,
            WATER: 7,
            BRICK: 8
        };

        const BLOCK_COLORS = {
            [BLOCK_TYPES.GRASS]: { top: 0x5D8C2E, side: 0x6B4423, bottom: 0x5C4033 },
            [BLOCK_TYPES.DIRT]: { top: 0x5C4033, side: 0x5C4033, bottom: 0x5C4033 },
            [BLOCK_TYPES.STONE]: { top: 0x808080, side: 0x707070, bottom: 0x606060 },
            [BLOCK_TYPES.SAND]: { top: 0xE2C97F, side: 0xD4B96A, bottom: 0xC4A855 },
            [BLOCK_TYPES.WOOD]: { top: 0x6B4423, side: 0x4A3728, bottom: 0x4A3728 },
            [BLOCK_TYPES.LEAVES]: { top: 0x2D5A27, side: 0x2D5A27, bottom: 0x2D5A27 },
            [BLOCK_TYPES.WATER]: { top: 0x3498DB, side: 0x3498DB, bottom: 0x3498DB },
            [BLOCK_TYPES.BRICK]: { top: 0xB55A4A, side: 0xA04A3A, bottom: 0x904A3A }
        };

        const BLOCK_NAMES = ['Air', 'Grass', 'Dirt', 'Stone', 'Sand', 'Wood', 'Leaves', 'Water', 'Brick'];
        const CHUNK_SIZE = 16;
        const RENDER_DISTANCE = 4;
        const WORLD_HEIGHT = 64;
        const GRAVITY = 25;
        const JUMP_VELOCITY = 10;
        const WALK_SPEED = 8;
        const SNEAK_SPEED = 4;
        const PLAYER_HEIGHT = 1.8;
        const REACH_DISTANCE = 6;

        let scene, camera, renderer;
        let chunks = {};
        let worldData = {};
        let selectedBlock = BLOCK_TYPES.GRASS;
        let hotbarSlot = 0;
        let instructionsVisible = false;
        let isPointerLocked = false;

        const player = {
            x: 0,
            y: 50,
            z: 0,
            velocityY: 0,
            onGround: false,
            rotationX: 0,
            rotationY: 0
        };

        const keys = {};
        let blockHighlight = null;
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        function createBlockGeometry() {
            return new THREE.BoxGeometry(1, 1, 1);
        }

        function createBlockMaterial(type) {
            const colors = BLOCK_COLORS[type];
            if (!colors) return new THREE.MeshBasicMaterial({ visible: false });

            const materials = [
                new THREE.MeshLambertMaterial({ color: colors.side }),
                new THREE.MeshLambertMaterial({ color: colors.side }),
                new THREE.MeshLambertMaterial({ color: colors.top }),
                new THREE.MeshLambertMaterial({ color: colors.bottom }),
                new THREE.MeshLambertMaterial({ color: colors.side }),
                new THREE.MeshLambertMaterial({ color: colors.side })
            ];

            if (type === BLOCK_TYPES.WATER) {
                materials.forEach(m => {
                    m.transparent = true;
                    m.opacity = 0.7;
                });
            }

            return materials;
        }

        const blockMeshes = {};
        for (let type = 1; type <= 8; type++) {
            blockMeshes[type] = {
                geometry: createBlockGeometry(),
                material: createBlockMaterial(type)
            };
        }

        class SimplexNoise {
            constructor(seed = Math.random()) {
                this.p = new Uint8Array(256);
                for (let i = 0; i < 256; i++) this.p[i] = i;
                for (let i = 255; i > 0; i--) {
                    seed = (seed * 16807) % 2147483647;
                    const j = Math.floor((seed / 2147483647) * (i + 1));
                    [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
                }
                this.perm = new Uint8Array(512);
                for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
            }

            noise2D(x, y) {
                const F2 = 0.5 * (Math.sqrt(3) - 1);
                const G2 = (3 - Math.sqrt(3)) / 6;
                
                const s = (x + y) * F2;
                const i = Math.floor(x + s);
                const j = Math.floor(y + s);
                const t = (i + j) * G2;
                const X0 = i - t;
                const Y0 = j - t;
                const x0 = x - X0;
                const y0 = y - Y0;

                const i1 = x0 > y0 ? 1 : 0;
                const j1 = x0 > y0 ? 0 : 1;
                const x1 = x0 - i1 + G2;
                const y1 = y0 - j1 + G2;
                const x2 = x0 - 1 + 2 * G2;
                const y2 = y0 - 1 + 2 * G2;

                const ii = i & 255;
                const jj = j & 255;

                const grad = (hash, x, y) => {
                    const h = hash & 7;
                    const u = h < 4 ? x : y;
                    const v = h < 4 ? y : x;
                    return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
                };

                let n0 = 0, n1 = 0, n2 = 0;
                let t0 = 0.5 - x0 * x0 - y0 * y0;
                if (t0 >= 0) {
                    t0 *= t0;
                    n0 = t0 * t0 * grad(this.perm[ii + this.perm[jj]], x0, y0);
                }
                let t1 = 0.5 - x1 * x1 - y1 * y1;
                if (t1 >= 0) {
                    t1 *= t1;
                    n1 = t1 * t1 * grad(this.perm[ii + i1 + this.perm[jj + j1]], x1, y1);
                }
                let t2 = 0.5 - x2 * x2 - y2 * y2;
                if (t2 >= 0) {
                    t2 *= t2;
                    n2 = t2 * t2 * grad(this.perm[ii + 1 + this.perm[jj + 1]], x2, y2);
                }

                return 70 * (n0 + n1 + n2);
            }

            noise3D(x, y, z) {
                return (this.noise2D(x, y) + this.noise2D(y, z) + this.noise2D(x, z)) / 3;
            }
        }

        const noise = new SimplexNoise(12345);

        function getBiome(x, z) {
            const n = noise.noise2D(x * 0.02, z * 0.02);
            if (n > 0.3) return 'desert';
            if (n > 0.1) return 'forest';
            return 'plains';
        }

        function getHeight(x, z, biome) {
            let height = 8;
            height += noise.noise2D(x * 0.05, z * 0.05) * 12;
            height += noise.noise2D(x * 0.1, z * 0.1) * 4;
            
            if (biome === 'desert') height += noise.noise2D(x * 0.03, z * 0.03) * 3;
            
            return Math.floor(height + WORLD_HEIGHT / 2);
        }

        function generateChunk(chunkX, chunkZ) {
            const key = `${chunkX},${chunkZ}`;
            if (chunks[key]) return;

            const chunkData = {};
            const biome = getBiome(chunkX * CHUNK_SIZE, chunkZ * CHUNK_SIZE);

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    const worldX = chunkX * CHUNK_SIZE + x;
                    const worldZ = chunkZ * CHUNK_SIZE + z;
                    const height = getHeight(worldX, worldZ, biome);
                    
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        const key = `${worldX},${y},${worldZ}`;
                        
                        if (y < height - 4) {
                            const caveNoise = noise.noise3D(worldX * 0.08, y * 0.08, worldZ * 0.08);
                            if (caveNoise > 0.5) {
                                chunkData[key] = BLOCK_TYPES.AIR;
                                continue;
                            }
                            chunkData[key] = BLOCK_TYPES.STONE;
                        } else if (y < height - 1) {
                            chunkData[key] = BLOCK_TYPES.DIRT;
                        } else if (y < height) {
                            if (biome === 'desert') {
                                chunkData[key] = BLOCK_TYPES.SAND;
                            } else {
                                chunkData[key] = BLOCK_TYPES.GRASS;
                            }
                        } else if (y < height + 1 && biome === 'desert') {
                            chunkData[key] = BLOCK_TYPES.SAND;
                        } else {
                            chunkData[key] = BLOCK_TYPES.AIR;
                        }
                    }

                    if (biome === 'plains') {
                        const treeNoise = noise.noise2D(worldX * 0.5, worldZ * 0.5);
                        if (treeNoise > 0.7) {
                            const treeX = worldX;
                            const treeZ = worldZ;
                            const trunkHeight = 4 + Math.floor(Math.random() * 2);
                            
                            for (let ty = 0; ty < trunkHeight; ty++) {
                                worldData[`${treeX},${height + ty},${treeZ}`] = BLOCK_TYPES.WOOD;
                            }
                            
                            for (let lx = -2; lx <= 2; lx++) {
                                for (let lz = -2; lz <= 2; lz++) {
                                    for (let ly = 0; ly < 3; ly++) {
                                        if (Math.abs(lx) === 2 && Math.abs(lz) === 2 && ly < 2) continue;
                                        if (Math.abs(lx) < 2 && Math.abs(lz) < 2 && ly < 1) continue;
                                        worldData[`${treeX + lx},${height + trunkHeight + ly},${treeZ + lz}`] = BLOCK_TYPES.LEAVES;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            chunks[key] = chunkData;
            Object.assign(worldData, chunkData);
        }

        function getBlock(x, y, z) {
            const key = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            return worldData[key] || BLOCK_TYPES.AIR;
        }

        function setBlock(x, y, z, type) {
            const key = `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
            worldData[key] = type;
            updateChunkMesh(Math.floor(x / CHUNK_SIZE), Math.floor(z / CHUNK_SIZE));
        }

        function updateChunkMesh(chunkX, chunkZ) {
            const key = `${chunkX},${chunkZ}`;
            const group = scene.getObjectByName(`chunk_${key}`);
            if (group) {
                scene.remove(group);
            }

            const meshGroup = new THREE.Group();
            meshGroup.name = `chunk_${key}`;

            const blocksToRender = {};

            for (let x = 0; x < CHUNK_SIZE; x++) {
                for (let z = 0; z < CHUNK_SIZE; z++) {
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        const worldX = chunkX * CHUNK_SIZE + x;
                        const worldZ = chunkZ * CHUNK_SIZE + z;
                        const block = getBlock(worldX, y, worldZ);
                        
                        if (block !== BLOCK_TYPES.AIR) {
                            const hasAirNeighbor = 
                                getBlock(worldX + 1, y, worldZ) === BLOCK_TYPES.AIR ||
                                getBlock(worldX - 1, y, worldZ) === BLOCK_TYPES.AIR ||
                                getBlock(worldX, y + 1, worldZ) === BLOCK_TYPES.AIR ||
                                getBlock(worldX, y - 1, worldZ) === BLOCK_TYPES.AIR ||
                                getBlock(worldX, y, worldZ + 1) === BLOCK_TYPES.AIR ||
                                getBlock(worldX, y, worldZ - 1) === BLOCK_TYPES.AIR;

                            if (hasAirNeighbor) {
                                if (!blocksToRender[block]) blocksToRender[block] = [];
                                blocksToRender[block].push({ x: worldX, y, z: worldZ });
                            }
                        }
                    }
                }
            }

            for (const blockType in blocksToRender) {
                const blocks = blocksToRender[blockType];
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = createBlockMaterial(parseInt(blockType));
                
                const instancedMesh = new THREE.InstancedMesh(geometry, material, blocks.length);
                
                const matrix = new THREE.Matrix4();
                blocks.forEach((block, i) => {
                    matrix.setPosition(block.x, block.y, block.z);
                    instancedMesh.setMatrixAt(i, matrix);
                });
                
                instancedMesh.instanceMatrix.needsUpdate = true;
                meshGroup.add(instancedMesh);
            }

            scene.add(meshGroup);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0xC8E6FF, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('game-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xB0C4DE, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xFFFACD, 0.8);
            directionalLight.position.set(50, 100, 50);
            scene.add(directionalLight);

            const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x3D2817, 0.4);
            scene.add(hemisphereLight);

            const highlightGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
            const highlightMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.3,
                wireframe: true
            });
            blockHighlight = new THREE.Mesh(highlightGeo, highlightMat);
            blockHighlight.visible = false;
            scene.add(blockHighlight);

            generateInitialWorld();
            createHotbar();
            setupEventListeners();
            updateDebug();
        }

        function generateInitialWorld() {
            const playerChunkX = Math.floor(player.x / CHUNK_SIZE);
            const playerChunkZ = Math.floor(player.z / CHUNK_SIZE);

            for (let cx = playerChunkX - RENDER_DISTANCE; cx <= playerChunkX + RENDER_DISTANCE; cx++) {
                for (let cz = playerChunkZ - RENDER_DISTANCE; cz <= playerChunkZ + RENDER_DISTANCE; cz++) {
                    generateChunk(cx, cz);
                    updateChunkMesh(cx, cz);
                }
            }
        }

        function updateChunks() {
            const playerChunkX = Math.floor(player.x / CHUNK_SIZE);
            const playerChunkZ = Math.floor(player.z / CHUNK_SIZE);

            for (let cx = playerChunkX - RENDER_DISTANCE; cx <= playerChunkX + RENDER_DISTANCE; cx++) {
                for (let cz = playerChunkZ - RENDER_DISTANCE; cz <= playerChunkZ + RENDER_DISTANCE; cz++) {
                    if (!chunks[`${cx},${cz}`]) {
                        generateChunk(cx, cz);
                        updateChunkMesh(cx, cz);
                    }
                }
            }
        }

        function createHotbar() {
            const hotbar = document.getElementById('hotbar');
            hotbar.innerHTML = '';

            const blockTypes = [BLOCK_TYPES.GRASS, BLOCK_TYPES.DIRT, BLOCK_TYPES.STONE, 
                              BLOCK_TYPES.SAND, BLOCK_TYPES.WOOD, BLOCK_TYPES.LEAVES, 
                              BLOCK_TYPES.WATER, BLOCK_TYPES.BRICK];

            blockTypes.forEach((type, index) => {
                const slot = document.createElement('div');
                slot.className = 'hotbar-slot' + (index === 0 ? ' selected' : '');
                slot.innerHTML = `
                    <canvas class="block-icon" width="36" height="36" data-block="${type}"></canvas>
                    <span class="slot-number">${index + 1}</span>
                `;
                hotbar.appendChild(slot);
            });

            document.querySelectorAll('.block-icon').forEach(canvas => {
                const ctx = canvas.getContext('2d');
                const type = parseInt(canvas.dataset.block);
                const colors = BLOCK_COLORS[type];
                
                ctx.fillStyle = '#' + colors.top.toString(16).padStart(6, '0');
                ctx.fillRect(0, 0, 36, 36);
                
                ctx.fillStyle = '#' + colors.side.toString(16).padStart(6, '0');
                ctx.fillRect(0, 0, 8, 36);
                ctx.fillRect(28, 0, 8, 36);
                
                ctx.fillStyle = '#' + (colors.bottom || colors.side).toString(16).padStart(6, '0');
                ctx.fillRect(0, 28, 36, 8);
            });
        }

        function updateHotbarSelection() {
            document.querySelectorAll('.hotbar-slot').forEach((slot, index) => {
                slot.classList.toggle('selected', index === hotbarSlot);
            });
            
            const blockTypes = [BLOCK_TYPES.GRASS, BLOCK_TYPES.DIRT, BLOCK_TYPES.STONE, 
                              BLOCK_TYPES.SAND, BLOCK_TYPES.WOOD, BLOCK_TYPES.LEAVES, 
                              BLOCK_TYPES.WATER, BLOCK_TYPES.BRICK];
            selectedBlock = blockTypes[hotbarSlot];
        }

        function setupEventListeners() {
            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                
                if (e.code === 'KeyH') {
                    instructionsVisible = !instructionsVisible;
                    document.getElementById('instructions').style.display = instructionsVisible ? 'block' : 'none';
                }
                
                if (e.code >= 'Digit1' && e.code <= 'Digit8') {
                    hotbarSlot = parseInt(e.code.slice(-1)) - 1;
                    updateHotbarSelection();
                }
            });

            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (isPointerLocked) {
                    player.rotationY -= e.movementX * 0.002;
                    player.rotationX -= e.movementY * 0.002;
                    player.rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotationX));
                }
            });

            document.getElementById('start-screen').addEventListener('click', function() {
                renderer.domElement.requestPointerLock();
            });
            
            renderer.domElement.addEventListener('click', function() {
                if (!isPointerLocked) {
                    renderer.domElement.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
                document.getElementById('start-screen').style.display = isPointerLocked ? 'none' : 'flex';
            });

            renderer.domElement.addEventListener('mousedown', (e) => {
                if (!isPointerLocked) return;
                
                const hit = raycast();
                
                if (e.button === 0 && hit) {
                    setBlock(hit.x, hit.y, hit.z, BLOCK_TYPES.AIR);
                } else if (e.button === 2 && hit) {
                    const placePos = getPlacePosition(hit);
                    if (placePos && !checkCollision(placePos.x, placePos.y, placePos.z)) {
                        setBlock(placePos.x, placePos.y, placePos.z, selectedBlock);
                    }
                }
            });

            renderer.domElement.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });

            document.addEventListener('wheel', (e) => {
                if (!isPointerLocked) return;
                
                if (e.deltaY > 0) {
                    hotbarSlot = (hotbarSlot + 1) % 8;
                } else {
                    hotbarSlot = (hotbarSlot + 7) % 8;
                }
                updateHotbarSelection();
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function getCameraDirection() {
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            return dir;
        }

        function raycast() {
            const dir = getCameraDirection();
            const start = new THREE.Vector3(player.x, player.y + PLAYER_HEIGHT * 0.8, player.z);
            
            for (let i = 1; i <= REACH_DISTANCE; i++) {
                const checkPos = start.clone().add(dir.clone().multiplyScalar(i));
                const blockX = Math.floor(checkPos.x);
                const blockY = Math.floor(checkPos.y);
                const blockZ = Math.floor(checkPos.z);
                
                const block = getBlock(blockX, blockY, blockZ);
                if (block !== BLOCK_TYPES.AIR && block !== BLOCK_TYPES.WATER) {
                    return { x: blockX, y: blockY, z: blockZ };
                }
            }
            return null;
        }

        function getPlacePosition(hit) {
            const dir = getCameraDirection();
            const normal = new THREE.Vector3();
            
            const playerBlockX = Math.floor(player.x);
            const playerBlockY = Math.floor(player.y);
            const playerBlockZ = Math.floor(player.z);
            
            if (Math.abs(hit.x - playerBlockX) > Math.abs(hit.y - playerBlockY) &&
                Math.abs(hit.x - playerBlockX) > Math.abs(hit.z - playerBlockZ)) {
                normal.x = hit.x < player.x ? -1 : 1;
            } else if (Math.abs(hit.y - playerBlockY) > Math.abs(hit.z - playerBlockZ)) {
                normal.y = hit.y < player.y ? -1 : 1;
            } else {
                normal.z = hit.z < player.z ? -1 : 1;
            }
            
            const dx = Math.abs(hit.x + normal.x - player.x);
            const dy = Math.abs(hit.y + normal.y - (player.y + PLAYER_HEIGHT * 0.5));
            const dz = Math.abs(hit.z + normal.z - player.z);
            
            if (dx < 0.5 && dy < 1 && dz < 0.5) {
                return null;
            }
            
            return {
                x: hit.x + normal.x,
                y: hit.y + normal.y,
                z: hit.z + normal.z
            };
        }

        function checkCollision(x, y, z) {
            const playerMinX = player.x - 0.3;
            const playerMaxX = player.x + 0.3;
            const playerMinY = player.y;
            const playerMaxY = player.y + PLAYER_HEIGHT;
            const playerMinZ = player.z - 0.3;
            const playerMaxZ = player.z + 0.3;

            const blockMinX = x;
            const blockMaxX = x + 1;
            const blockMinY = y;
            const blockMaxY = y + 1;
            const blockMinZ = z;
            const blockMaxZ = z + 1;

            return playerMinX < blockMaxX && playerMaxX > blockMinX &&
                   playerMinY < blockMaxY && playerMaxY > blockMinY &&
                   playerMinZ < blockMaxZ && playerMaxZ > blockMinZ;
        }

        function hasBlockAt(x, y, z) {
            const block = getBlock(x, y, z);
            return block !== BLOCK_TYPES.AIR && block !== BLOCK_TYPES.WATER;
        }

        function updatePlayer(deltaTime) {
            const speed = keys['ShiftLeft'] ? SNEAK_SPEED : WALK_SPEED;
            const forward = new THREE.Vector3(
                Math.sin(player.rotationY),
                0,
                Math.cos(player.rotationY)
            );
            const right = new THREE.Vector3(
                Math.cos(player.rotationY),
                0,
                -Math.sin(player.rotationY)
            );

            let moveX = 0, moveZ = 0;

            if (keys['KeyW']) {
                moveX += forward.x * speed * deltaTime;
                moveZ += forward.z * speed * deltaTime;
            }
            if (keys['KeyS']) {
                moveX -= forward.x * speed * deltaTime;
                moveZ -= forward.z * speed * deltaTime;
            }
            if (keys['KeyA']) {
                moveX -= right.x * speed * deltaTime;
                moveZ -= right.z * speed * deltaTime;
            }
            if (keys['KeyD']) {
                moveX += right.x * speed * deltaTime;
                moveZ += right.z * speed * deltaTime;
            }

            let newX = player.x + moveX;
            let newZ = player.z + moveZ;

            if (hasBlockAt(Math.floor(newX), Math.floor(player.y), Math.floor(player.z))) {
                newX = player.x;
            }
            if (hasBlockAt(Math.floor(newX), Math.floor(player.y), Math.floor(newZ + (moveZ > 0 ? 0.5 : -0.5)))) {
                newZ = player.z;
            }

            player.x = newX;
            player.z = newZ;

            player.velocityY -= GRAVITY * deltaTime;
            player.y += player.velocityY * deltaTime;

            player.onGround = false;
            for (let y = Math.floor(player.y); y >= Math.floor(player.y) - 2; y--) {
                if (hasBlockAt(Math.floor(player.x), y, Math.floor(player.z))) {
                    player.y = y + 1;
                    player.velocityY = 0;
                    player.onGround = true;
                    break;
                }
            }

            if (keys['Space'] && player.onGround) {
                player.velocityY = JUMP_VELOCITY;
            }

            if (player.y < -10) {
                player.y = 50;
                player.velocityY = 0;
            }

            camera.position.set(player.x, player.y + PLAYER_HEIGHT * 0.8, player.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotationY;
            camera.rotation.x = player.rotationX;
        }

        function updateBlockHighlight() {
            const hit = raycast();
            if (hit) {
                blockHighlight.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5);
                blockHighlight.visible = true;
            } else {
                blockHighlight.visible = false;
            }
        }

        function updateDebug() {
            const debug = document.getElementById('debug');
            debug.innerHTML = `
                FPS: ${fps}<br>
                X: ${player.x.toFixed(1)}<br>
                Y: ${player.y.toFixed(1)}<br>
                Z: ${player.z.toFixed(1)}<br>
                Block: ${BLOCK_NAMES[selectedBlock]}
            `;
        }

        function animate() {
            requestAnimationFrame(animate);

            const currentTime = performance.now();
            const deltaTime = Math.min((currentTime - lastFrameTime) / 1000, 0.1);
            lastFrameTime = currentTime;

            frameCount++;
            if (frameCount % 30 === 0) {
                fps = Math.round(1 / deltaTime);
                updateDebug();
            }

            if (isPointerLocked) {
                updatePlayer(deltaTime);
                updateChunks();
                updateBlockHighlight();
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
